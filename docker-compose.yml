version: "3.9"

services:
  soc-tracker:
    build: .
    container_name: soc-tracker
    restart: unless-stopped
    ports:
      - "9897:5000"
    volumes:
      # 2026-07-20: DB ve upload'lar da named volume yerine host bind-mount'a
      # taşındı. Önceki durumda (soc_data named volume) "docker volume rm
      # soc_data" veya "docker-compose down -v" canlı DB'yi (tracker.db)
      # doğrudan silebiliyordu — sadece yedekler bundan korunuyordu. Artık
      # DB de host'un kendi dosya sisteminde düz bir dosya; bu iki komut da
      # ona dokunmuyor. Ayrıca yedekler bilinçli olarak AYRI bir host
      # dizininde (./backups, ./data'nın ALTINDA değil) — böylece host
      # üzerinde yanlışlıkla "rm -rf ./data" çalıştırılsa bile yedekler
      # etkilenmez.
      - ${DATA_HOST_DIR:-./data}:/data
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/static/uploads
      - ${BACKUP_HOST_DIR:-./backups}:/data/backups
    environment:
      - SECRET_KEY=${SECRET_KEY:-soc-tracker-CHANGE-THIS-IN-PRODUCTION}
      # Audit hash-zinciri salt'ı — bkz. docs/audit_logging.md. Prod'da .env ile
      # override edilmezse dev fallback kullanılır (zincir hâlâ çalışır ama
      # salt herkese açık/tahmin edilebilir olur).
      - AUDIT_CHAIN_SECRET=${AUDIT_CHAIN_SECRET:-soc-tracker-audit-chain-dev-secret-CHANGE-IN-PRODUCTION}
      # XSOAR webhook API anahtarı — bkz. docs/xsoar_integration.md
      - XSOAR_WEBHOOK_TOKEN=${XSOAR_WEBHOOK_TOKEN:-soc-tracker-xsoar-webhook-CHANGE-IN-PRODUCTION}
      - DATABASE=/data/tracker.db
      - BACKUP_DIR=/data/backups
      - UPLOAD_FOLDER=/app/static/uploads
      - TZ=Europe/Istanbul
