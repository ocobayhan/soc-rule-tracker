<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Rule Tracker</title>
  <link rel="stylesheet" href="/static/styles.css?v=3" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">&#9656;</div>
      <span class="login-logo-text">SOC Rule Tracker</span>
    </div>
    <p class="login-subtitle">Kural Yönetim Platformu</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" class="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Kullanıcı Adı</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="kullanıcı adı" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Şifre</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full">Giriş Yap</button>
    </form>
  </div>
</body>
</html>
