<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/styles.css?v=11.11" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <svg class="login-logo-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.2 4.5 5v6.1c0 5.1 3.3 9.1 7.5 10.7 4.2-1.6 7.5-5.6 7.5-10.7V5L12 2.2z" fill="#5E6AD2"/>
        <path d="M8.7 12.3l2.1 2.1 4.5-4.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="login-logo-text">SOC Tracker</span>
    </div>
    <p class="login-subtitle">Kural Yönetim Platformu</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" class="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Kullanıcı Adı</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="kullanıcı adı" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Şifre</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full">Giriş Yap</button>
    </form>
    <div class="text-muted" style="font-size:10px;text-align:center;margin-top:14px;opacity:0.6">v{{ app_version }}</div>
  </div>
</body>
</html>
